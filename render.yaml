services:
  - type: web
    name: incident-assignment-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_API_KEY
        sync: false
      - key: SHIFT_ROSTER_API_URL
        value: https://dev.symphony.saint-gobain.com/api/external/v1/shift-roster/assignment-group/employees
      - key: SHIFT_ROSTER_API_KEY
        sync: false
      - key: SN_INSTANCE
        sync: false
      - key: SN_USER
        sync: false
      - key: SN_PASSWORD
        sync: false
      - key: ATTACH_NO_AGENT_WORK_NOTE
        value: "true"
